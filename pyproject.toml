[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbx-utherm"
version = "0.1.0"
description = "Urban thermal comfort and microclimate simulation with PyTorch"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "Sashank Silwal"},
  {name = "Rubab Saher"},
  {name = "Daniel G. Aliaga"},
]
keywords = ["urban-microclimate", "thermal-comfort", "utci", "energy-balance", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24,<2", "torch>=2.2", "scipy>=1.10", "pandas>=2",
  "matplotlib>=3.7", "netCDF4>=1.6", "xarray>=2023.1", "pytz>=2023.3",
  "timezonefinder>=6,<7", "tqdm>=4.65", "shapely>=2",
]

[project.optional-dependencies]
geo = ["GDAL>=3", "rasterio>=1.3"]
gui = ["PyQt5>=5.15"]
dev = ["pytest>=8", "build>=1.2", "twine>=6", "ruff>=0.9"]

[project.scripts]
utherm = "utherm.cli:main"
utherm-geometry = "utherm.geometry:main"

[project.urls]
Homepage = "https://github.com/urbx-lab/UTherm"
Repository = "https://github.com/urbx-lab/UTherm"
Documentation = "https://github.com/urbx-lab/UTherm#readme"
Issues = "https://github.com/urbx-lab/UTherm/issues"

[tool.setuptools.packages.find]
include = ["utherm*"]

[tool.setuptools.package-data]
utherm = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
