name: Bug report
description: Report a reproducible installation, numerical, or workflow problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducer
      description: Include a small synthetic scene or command, model settings, and the full error.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of utherm doctor --json and the UTherm commit or release.
      render: json
    validations:
      required: true
