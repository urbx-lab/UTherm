name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "4"
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: macos-15, python: '3.11'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Python version
        run: sed 's/python=3.11/python=${{ matrix.python }}/' environment.yml > /tmp/utherm-ci.yml
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: /tmp/utherm-ci.yml
          cache-environment: true
      - name: Install and inspect dependencies
        shell: micromamba-shell {0}
        run: |
          python -m pip install -e '.[dev]'
          python -m pip check
          utherm doctor --json
      - name: Check code and API documentation
        shell: micromamba-shell {0}
        run: |
          ruff check utherm tests examples tools
          ruff format --check utherm/core.py utherm/cli.py utherm/doctor.py utherm/_outputs.py utherm/_validation.py tools tests/test_cli.py tests/test_doctor.py tests/test_outputs.py tests/test_advection_diffusion.py
          python tools/build_api_reference.py --check
      - name: Run tests with coverage gate
        shell: micromamba-shell {0}
        run: pytest -q --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=test-results.xml
      - name: Build and inspect distributions
        shell: micromamba-shell {0}
        run: |
          utherm --version
          python -m utherm --help
          utherm-geometry --help
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel outside the source tree
        shell: micromamba-shell {0}
        run: |
          python -m pip uninstall -y urbx-utherm
          python -m pip install --no-deps dist/*.whl
          cp examples/synthetic_scene.py /tmp/utherm-example.py
          cd /tmp
          python -c "from importlib.resources import files; import utherm; assert 'site-packages' in utherm.__file__; assert files('utherm').joinpath('landcoverclasses_2016a.txt').is_file(); print(utherm.__version__)"
          utherm doctor --json
          python /tmp/utherm-example.py --output /tmp/utherm-wheel-output
      - name: Upload test reports and packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            test-results.xml
            dist/
